<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Counter poster · Best 1 Sweets</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&family=Lalezar&family=Cairo:wght@400;500;600;700&display=swap">
  <style>
    /* Printable A5 counter poster. Print with "Margins: none" and "Background graphics" on.
       QR codes are static inline SVG, generated locally with segno (see README). */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #EBD9B5; font-family: "Mukta", Arial, sans-serif; color: #3A1328; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 20px 16px 0; }
    .toolbar button { font: 500 15px "Mukta", Arial, sans-serif; padding: 0 24px; min-height: 44px; border: 0; border-radius: 999px; background: #9E1F63; color: #fff; cursor: pointer; }
    .toolbar a { font: 500 15px "Mukta", Arial, sans-serif; color: #9E1F63; align-self: center; min-height: 44px; display: inline-flex; align-items: center; }
    .sheet {
      width: 148mm; height: 210mm; margin: 20px auto 40px; background: #FFF8EC;
      padding: 13mm 13mm 11mm; display: flex; flex-direction: column; align-items: center; text-align: center;
      position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden;
      font-variant-numeric: lining-nums;
    }
    .logo { width: 19mm; height: 19mm; position: relative; }
    .name { margin: 3.5mm 0 0; font: 400 13mm/1.05 "Rozha One", Georgia, serif; position: relative; }
    .sub { margin: 2.2mm 0 0; font: 500 2.7mm "Mukta", Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #9E1F63; position: relative; }
    .ar-name { margin: 1.6mm 0 0; font: 600 4mm/1.4 "Cairo", sans-serif; color: #9E1F63; position: relative; }
    .rule { width: 18mm; height: 0; border-top: 0.35mm solid #9E1F63; margin: 4.5mm 0 4mm; position: relative; }
    .cta { margin: 0; font: 600 6mm/1.15 "Mukta", Arial, sans-serif; color: #9E1F63; position: relative; }
    .cta-ar { margin: 1.6mm 0 0; font: 500 4mm/1.45 "Cairo", sans-serif; color: #6C4A57; position: relative; }
    .qr-box { margin-top: 4.5mm; padding: 2.5mm; background: #fff; border: 0.3mm solid #EED9B2; border-radius: 1.5mm; position: relative; }
    .qr { display: block; width: 54mm; height: 54mm; }
    .phone { margin: 4.5mm 0 0; font: 500 8.4mm/1 "Mukta", Arial, sans-serif; letter-spacing: .02em; font-variant-numeric: lining-nums tabular-nums; position: relative; }
    .phone-label { margin: 1.6mm 0 0; font: 500 2.6mm "Mukta", Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #9E1F63; position: relative; }
    .foot {
      margin-top: auto; width: 100%; display: flex; align-items: center; gap: 4mm; text-align: start;
      padding-top: 3.5mm; border-top: 0.25mm solid #EED9B2; position: relative;
    }
    .qr-small { display: block; width: 19mm; height: 19mm; flex: none; background: #fff; padding: 1.2mm; box-sizing: content-box; border: 0.25mm solid #EED9B2; }
    .foot p { margin: 0; font: 400 2.85mm/1.45 "Mukta", Arial, sans-serif; color: #6C4A57; }
    .foot b { font-weight: 600; color: #3A1328; }
    .sheet { background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2244%22%20height%3D%2230%22%3E%3Cpath%20d%3D%22M22%201L43%2015L22%2029L1%2015Z%22%20fill%3D%22none%22%20stroke%3D%22%23F2A81D%22%20stroke-opacity%3D%22.35%22%20stroke-width%3D%221%22/%3E%3C/svg%3E"); }
    .sheet::before { content: ''; position: absolute; inset: 5mm; border: .6mm solid #9E1F63; outline: .3mm dashed #F2A81D; outline-offset: -2mm; pointer-events: none; }
    .qr-box { border: .6mm solid #3A1328; border-radius: 1mm; }
    .foot { background: #FFF8EC; }
    .name { color: #9E1F63; }
    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 600px) {
      .sheet { zoom: .62; }
    }
  </style>
</head>
